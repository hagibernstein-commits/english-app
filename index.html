.eng-wc { background: var(--ds-white); border: 1px solid var(--ds-hairline); border-radius: 14px; padding: 12px 8px; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }

.eng-big { font-family: var(--ds-font-display); font-size: 48px; line-height: 1; }

.eng-pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; font-weight: 600; }

.eng-chip { background: var(--ds-raised); border-radius: 999px; padding: 6px 12px; font-size: 15px; }

.eng-unit-t .en { align-self: flex-start; }
.eng-reset { border-color: #e3b8b3; }

@media (display-mode: standalone) { .eng-topbar { padding-top: 12px; } }

ACT.toggleSent = el => { const i = parseInt(el.getAttribute('data-i'), 10); sentsShow = sentsShow.includes(i) ? sentsShow.filter(x => x !== i) : [...sentsShow, i]; render(); };
ACT.sentsDone = () => { const uid = view.u; upd(x => ({ ...x, steps: { ...x.steps, [uid]: (x.steps[uid] || 0) | 2 } })); go({ n: 'unit', u: uid }); };

// ===== story =====

function vStory(uid) {

let storyUnit = null;
ACT.playStory = () => { const u = UNITS[view.u - 1]; speak(u.story.lines.map(l => l.en).join(' '), 0.75); };
ACT.toggleStoryTr = () => { storyTr = !storyTr; render(); };
ACT.storyQs = () => { const u = UNITS[view.u - 1]; startQuiz(storyQs(u), 'practice', { title: 'שאלות על הסיפור', onAnswer: r => updW(undefined, r.ok), onExit: () => go({ n: 'story', u: u.id }), onDone: rs => {

} }); };

// ===== unit test =====
function vTestIntro(uid) {

        <p class="eng-note">ציון 85% ומעלה = שולט, 70% עד 84% = כמעט שם, מתחת ל-70% = כדאי לחזור על היחידה. אפשר לעשות את המבחן שוב, והשאלות משתנות.</p></div>
    <div class="eng-next"><button type="button" class="file-button" data-variant="primary" data-act="testStart">מתחילים</button></div>`;
}
ACT.testStart = () => { const u = UNITS[view.u - 1]; startQuiz(testSet(u), 'test', { title: `מבחן יחידה ${u.id}`, onExit: () => go({ n: 'test', u: u.id }), onDone: rs => {
    rs.forEach(x => updW(x.q.wordId, x.ok));
    const sk = scoreSkills(rs); const s = rs.filter(x => x.ok).length;
    upd(x => ({ ...x, tests: { ...x.tests, [u.id]: [...(x.tests[u.id] || []), { d: Date.now(), s, t: rs.length, sk }] } }));

    const extra = `<div class="eng-badge ${bd.c}">${bd.t}</div>${skillBars(scoreSkills(rs))}
        <p class="eng-note">${v >= 85 ? 'מצוין. אפשר להמשיך ליחידה הבאה.' : v >= 70 ? 'כמעט. כדאי לתרגל שוב את השלב החלש ולהמשיך.' : 'כדאי לחזור על המילים והמשפטים של היחידה, ואז לנסות את המבחן שוב.'}</p>`;
    summaryScreen(rs, `תוצאות מבחן יחידה ${u.id}`, () => go({ n: 'test', u: u.id }), () => go({ n: 'unit', u: u.id }), extra);
} }); };

// ===== placement =====
function vPlacementIntro() {
    return `${backBtn({ n: 'home' })}
    <h2 class="eng-h">מבחן מיון</h2>
    <div class="eng-card"><p>עד 20 שאלות מהקל אל הקשה. אם יהיה קשה מדי, המבחן ייעצר מוקדם וזה בסדר גמור. אין רמזים. מדלגים על מה שלא יודעים בבחירת התשובה שנראית הכי קרובה.</p>
        <p>כדאי להפעיל את הקול במכשיר ולשבת במקום שקט.</p></div>

}
ACT.placementStart = () => { startQuiz(placementSet(), 'placement', { title: 'מבחן מיון',
    skipRule: (r, next) => { const L = next.level || 1; if (L <= 1) return false; const lv = r.filter(x => x.q.level === L - 1); return lv.filter(x => x.ok).length < 3; },
    onExit: () => go({ n: 'placement' }), onDone: rs => {

// ===== parent =====
function vParent() {
    const p = prog;
    const agg = { v: [0, 0], l: [0, 0], g: [0, 0], r: [0, 0] };
    Object.values(p.tests).forEach(arr => { const a = arr[arr.length - 1]; if (a) Object.keys(agg).forEach(k => { agg[k][0] += a.sk[k][0]; agg[k][1] += a.sk[k][1]; }); });
    const weak = Object.entries(words).filter(([, w]) => w[1] > 0 && w[2] < 2).sort((a, b) => b[1][1] - a[1][1]).slice(0, 12).map(([id, w]) => ({ w: wordById(id), wrong: w[1] })).filter(x => x.w);
    const tested = Object.keys(p.tests).length;
    const mastered = UNITS.filter(u => bestOf(p, u.id) >= 85).length;
    const skillsWithData = Object.keys(agg).filter(k => agg[k][1] > 0).sort((a, b) => pct(agg[a][0], agg[a][1]) - pct(agg[b][0], agg[b][1]));
    const rec = tested === 0 ? 'עוד אין תוצאות מבחני יחידה. התחילו במבחן מיון או ביחידה 1.'
        : `היחידה הבאה: יחידה ${nextUnit()}. ${skillsWithData.length ? `המיומנות הכי חלשה כרגע: ${SKILLS[skillsWithData[0]]} (${pct(agg[skillsWithData[0]][0], agg[skillsWithData[0]][1])}%).` : ''}${weak.length ? ` יש ${weak.length} מילים לחזרה.` : ''}`;
    const rows = UNITS.map(u => {
        const t = p.tests[u.id] || []; const last = t[t.length - 1]; const bst = bestOf(p, u.id); const bd = band(bst);
        return `<div class="eng-trow">
            <div class="eng-trow-h"><strong>${u.e} יחידה ${u.id}: ${esc(u.he)}</strong>${t.length > 0 ? `<span class="eng-pill ${bd.c}">${bd.t}</span>` : ''}</div>
            <div class="eng-note">שלבים: ${bits(p.steps[u.id] || 0)}/4 · תרגול אחרון: ${p.prac[u.id] !== undefined ? `${p.prac[u.id]}%` : 'לא נעשה'}</div>
            <div class="eng-note">${t.length ? `מבחן: ${t.map(a => `${pct(a.s, a.t)}%`).join(', ')} (אחרון ב-${fmt(last.d)})` : 'מבחן: עוד לא נעשה'}</div></div>`;
    }).join('');
    return `${backBtn({ n: 'home' })}
    <h2 class="eng-h">לוח הורים</h2>
    <div class="eng-card"><strong>סיכום:</strong> ${tested} יחידות נבחנו, ${mastered} ברמת שליטה (85% ומעלה).<br />${esc(rec)}</div>
    <div class="eng-group"><h3 class="eng-glabel">מבחן מיון</h3>
        ${p.placement ? `<div class="eng-card"><p>${fmt(p.placement.d)}: ${LEVEL_NOTES[p.placement.level]}</p>${skillBars(p.placement.sk)}</div>` : '<p class="eng-note">עוד לא נעשה מבחן מיון.</p>'}</div>
    <div class="eng-group"><h3 class="eng-glabel">מיומנויות במבחני היחידות</h3>
        ${skillsWithData.length ? skillBars(agg) : '<p class="eng-note">יופיעו אחרי המבחן הראשון. מוצג המבחן האחרון בכל יחידה.</p>'}</div>
    <div class="eng-group"><h3 class="eng-glabel">יחידה אחרי יחידה</h3><div class="eng-table">${rows}</div></div>
    <div class="eng-group"><h3 class="eng-glabel">מילים לחזרה</h3>
        ${weak.length ? `<div class="eng-weak">${weak.map(x => `<span class="eng-chip"><span class="en" dir="ltr">${esc(x.w.en)}</span> = ${esc(x.w.he)}</span>`).join('')}</div>` : '<p class="eng-note">אין כרגע מילים שחוזרות על עצמן כטעות.</p>'}</div>
    <div class="eng-group"><h3 class="eng-glabel">איך ההערכה עובדת</h3><div class="eng-card eng-method">
        <p><strong>מיון:</strong> 20 שאלות בארבע רמות, מהקל לקשה. הרמה נקבעת לפי הרמה האחרונה שבה נענו נכון 4 מתוך 5. המבחן נעצר אם ברמה קיבלו פחות מ-3 מתוך 5.</p>
        <p><strong>מבחן יחידה:</strong> 12 שאלות: 4 אוצר מילים, 3 האזנה, 3 משפטים (השלמה וסידור), 2 הבנת הנקרא. בלי רמזים. השאלות נבחרות מחדש בכל ניסיון.</p>
        <p><strong>רמות:</strong> 85% ומעלה שולט, 70% עד 84% כמעט שם, מתחת ל-70% כדאי לחזור.</p>
        <p><strong>חזרה:</strong> מילה שנענתה לא נכון חוזרת עד ששתי תשובות נכונות ברצף.</p>
        <p class="eng-note">זו הערכה לימודית פשוטה של האפליקציה, לא מבחן תקני. הציונים נשמרים במכשיר בלבד.</p></div></div>
    <div class="eng-group"><h3 class="eng-glabel">איפוס</h3>${resetSectionHtml()}</div>`;
}

// ===== summary =====
let summaryData = null;
function summaryScreen(rs, title, onAgain, onBack, extra) {
    summaryData = { rs, title, onAgain, onBack, extra };
    view = { n: 'summary' }; render(); scrollToTop();
}
function vSummary() {
    const { rs, title, onAgain, extra } = summaryData;
    const first = rs.filter(r => !r.retry); const good = first.filter(r => r.ok).length; const wrong = first.filter(r => !r.ok);
    return `<h2 class="eng-h">${esc(title)}</h2>
    <div class="eng-card eng-score"><span class="eng-big">${good}/${first.length}</span><span>תשובות נכונות בניסיון הראשון (${pct(good, first.length)}%)</span></div>
    ${extra || ''}
    ${wrong.length > 0 ? `<div class="eng-group"><h3 class="eng-glabel">כדאי לזכור</h3><div class="eng-mist">${wrong.map(r => `<div class="en" dir="ltr">${esc(r.q.fix || r.q.stem)}</div>`).join('')}</div></div>` : ''}
    <div class="eng-row-btns">${onAgain ? '<button type="button" class="file-button is-compact" data-variant="secondary" data-act="sumAgain">עוד פעם</button>' : ''}<button type="button" class="file-button is-compact" data-variant="primary" data-act="sumBack">חזרה</button></div>`;
}
ACT.sumAgain = () => { if (summaryData.onAgain) summaryData.onAgain(); };
ACT.sumBack = () => { if (summaryData.onBack) summaryData.onBack(); };

// ===== placement result =====
function vPlacementResult() {
    const { rs, level, by } = view;
    return `<h2 class="eng-h">תוצאות מבחן המיון</h2>
    <div class="eng-card"><p><strong>${LEVEL_NOTES[level]}</strong></p>
        <p class="eng-note">אפשר תמיד לבחור כל יחידה אחרת. ההמלצה היא רק נקודת התחלה.</p></div>
    ${skillBars(scoreSkills(rs))}
    <div class="eng-row-btns"><button type="button" class="file-button" data-variant="primary" data-go='{"n":"home"}'>לדף הראשי</button></div>
    <p class="eng-note">ציוני הרמות: ${by.map((b, i) => b[1] ? `רמה ${i + 1}: ${b[0]}/${b[1]}` : null).filter(Boolean).join(' · ')}</p>`;
}

// ===== quiz engine =====
let quiz = null;
function startQuiz(qs, mode, opts) {
    quiz = { queue: qs, i: 0, sel: null, placed: [], checked: false, rs: [], mode, skipRule: opts.skipRule || null, onDone: opts.onDone, onExit: opts.onExit, onAnswer: opts.onAnswer || null, title: opts.title || '' };
    view = { n: 'quiz' }; render(); scrollToTop();
}
function quizHtml() {
    const q = quiz.queue[quiz.i];
    const retry = q.id.endsWith('#r');
    const total = quiz.mode === 'placement' ? 20 : quiz.queue.filter(x => !x.id.endsWith('#r')).length;
    const step = quiz.rs.filter(r => !r.retry).length;
    const listening = q.skill === 'l' && q.kind === 'mc';
    let ok = null;
    if (quiz.checked) ok = q.kind === 'mc' ? quiz.sel === q.ans : quiz.placed.map(p => q.tiles[p]).join(' ') === q.target.join(' ');
    const locked = quiz.mode === 'practice' && quiz.checked;
    const answered = q.kind === 'mc' ? quiz.sel !== null : quiz.placed.length === (q.tiles || []).length;
    let body = '';
    if (q.ctx) body += `<div class="eng-ctx en" dir="ltr">${q.ctx.map(l => `<p>${esc(l)}</p>`).join('')}</div>`;
    if (listening) {
        body += `<div class="eng-listen">${ttsState.supported
            ? `<button type="button" class="eng-bigspeak" data-act="qSpeak">🔊 השמעה</button><button type="button" class="eng-link" data-act="qSpeakSlow">🐢 לאט</button>`
            : `<p class="en eng-stem" dir="ltr">${esc(q.audio)}<span class="eng-note he">אין השמעת קול במכשיר הזה, לכן המילים מוצגות בכתב.</span></p>`}</div>`;
    }
    if (q.stem) body += `<div class="eng-stem ${q.stemKind === 'emoji' ? 'is-emoji' : 'en'}" ${q.stemKind === 'emoji' ? '' : 'dir="ltr"'}>${esc(q.stem)}${q.stemKind === 'en' && q.audio ? speakerBtn(q.audio) : ''}</div>`;
    if (q.stemHe) body += `<p class="eng-he">${esc(q.stemHe)}</p>`;
    if (q.kind === 'mc') {
        body += `<div class="eng-opts${q.opts.some(o => o.big) ? ' is-big' : ''}">` + q.opts.map((o, k) => {
            let cls = 'eng-opt'; if (quiz.sel === k) cls += ' is-sel';
            if (locked) { if (k === q.ans) cls += ' is-right'; else if (quiz.sel === k) cls += ' is-wrong'; }
            return `<button type="button" class="${cls}" ${o.ltr ? 'dir="ltr"' : ''} data-act="qChoose" data-k="${k}">${o.big ? `<span class="eng-emo">${esc(o.t)}</span>` : esc(o.t)}</button>`;
        }).join('') + '</div>';
    } else {
        const slots = quiz.placed.length === 0 ? '<span class="eng-hint he" dir="rtl">לחצו על המילים לפי הסדר</span>'
            : quiz.placed.map((p, k) => `<button type="button" class="eng-tile is-in" ${locked ? 'disabled' : ''} data-act="qUnplace" data-k="${k}">${esc(q.tiles[p])}</button>`).join('');
        const pool = q.tiles.map((t, k) => quiz.placed.includes(k) ? `<span class="eng-tile is-ghost">${esc(t)}</span>` : `<button type="button" class="eng-tile" ${locked ? 'disabled' : ''} data-act="qPlace" data-k="${k}">${esc(t)}</button>`).join('');
        body += `<div class="eng-order"><div class="eng-slots en" dir="ltr">${slots}</div><div class="eng-pool en" dir="ltr">${pool}</div>
            ${quiz.placed.length > 0 && !locked ? '<button type="button" class="eng-link" data-act="qResetTiles">↺ התחלה מחדש</button>' : ''}</div>`;
    }
    if (locked) {
        body += `<div class="eng-fb ${ok ? 'is-ok' : 'is-no'}" role="status"><strong>${ok ? 'נכון!' : 'לא בדיוק.'}</strong>
            ${!ok ? ` התשובה הנכונה: <span class="en" dir="ltr">${esc(q.fix || '')}</span>` : ''}
            ${!ok && !retry ? '<span class="eng-note"> השאלה תחזור עוד פעם בסוף.</span>' : ''}
            ${q.audio && q.kind === 'order' ? speakerBtn(q.audio, undefined, 'שמעו') : ''}</div>`;
    }
    const btnLabel = quiz.mode === 'practice' && !quiz.checked && q.kind === 'order' ? 'בדיקה' : locked ? 'המשך' : quiz.mode === 'practice' ? 'בדיקה' : 'הבא';
    return `<div class="eng-quiz">
    <div class="eng-quiz-top"><button type="button" class="eng-link" data-act="qExit">← יציאה</button>
        <span class="eng-count">${quiz.mode === 'placement' ? `שאלה ${step + 1}` : `שאלה ${Math.min(step + 1, total)} מתוך ${total}`}${retry ? ' · עוד ניסיון' : ''}</span></div>
    <div class="eng-bar" aria-hidden="true"><span style="width:${Math.min(100, (step / total) * 100)}%"></span></div>
    <p class="eng-prompt">${esc(q.prompt)}</p>${body}
    <div class="eng-next"><button type="button" class="file-button" data-variant="primary" ${answered ? '' : 'disabled'} data-act="qPress">${btnLabel}</button></div></div>`;
}
let quizAudioTimer = null;
function quizAfterRender() {
    if (quizAudioTimer) { clearTimeout(quizAudioTimer); quizAudioTimer = null; }
    const q = quiz.queue[quiz.i];
    if (quiz.lastAudio === q.id + '.' + quiz.i) return;
    quiz.lastAudio = q.id + '.' + quiz.i;
    if (q.audio && q.kind === 'mc' && (q.skill === 'l' || q.stemKind === 'en')) {
        quizAudioTimer = setTimeout(() => speak(q.audio, q.skill === 'l' && q.audio.includes(' ') ? 0.75 : 0.7), 250);
    }
}
ACT.qSpeak = () => { const q = quiz.queue[quiz.i]; speak(q.audio, q.audio.includes(' ') ? 0.75 : 0.7); };
ACT.qSpeakSlow = () => { const q = quiz.queue[quiz.i]; speak(q.audio, 0.45); };
ACT.qChoose = el => { const k = parseInt(el.getAttribute('data-k'), 10); if (quiz.mode === 'practice' && quiz.checked) return; quiz.sel = k; if (quiz.mode === 'practice') quiz.checked = true; render(); };
ACT.qPlace = el => { const k = parseInt(el.getAttribute('data-k'), 10); quiz.placed.push(k); render(); };
ACT.qUnplace = el => { const k = parseInt(el.getAttribute('data-k'), 10); quiz.placed = quiz.placed.filter((_, x) => x !== k); render(); };
ACT.qResetTiles = () => { quiz.placed = []; render(); };
ACT.qExit = () => { const f = quiz.onExit; const qz = quiz; quiz = null; if (f) f(); else go({ n: 'home' }); };
ACT.qPress = () => {
    const q = quiz.queue[quiz.i];
    const good = q.kind === 'mc' ? quiz.sel === q.ans : quiz.placed.map(p => q.tiles[p]).join(' ') === q.target.join(' ');
    if (quiz.mode === 'practice' && !quiz.checked) { quiz.checked = true; render(); return; }
    const retry = q.id.endsWith('#r');
    let nq = quiz.queue;
    if (quiz.mode === 'practice') {
        if (!good && !retry) nq = [...quiz.queue, { ...q, id: q.id + '#r', tiles: q.tiles ? shuffle(q.tiles) : q.tiles }];
    }
    const r = { q, ok: !!good, retry };
    quiz.rs.push(r);
    if (quiz.onAnswer) quiz.onAnswer(r);
    const ni = quiz.i + 1;
    if (ni >= nq.length || (quiz.skipRule && quiz.skipRule(quiz.rs, nq[ni]))) {
        const done = quiz.onDone; const results = quiz.rs; quiz = null;
        done(results); return;
    }
    quiz.queue = nq; quiz.i = ni; quiz.sel = null; quiz.placed = []; quiz.checked = false;
    render(); scrollToTop();
};

// ===== boot =====
render();

</script>
